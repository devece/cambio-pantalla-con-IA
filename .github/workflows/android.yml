name: Android

# Compila la app de la radio y deja el APK listo para descargar.
# Se ejecuta solo al cambiar la carpeta android/ o los datos compartidos, y también a mano (Actions > Android > Run workflow).
on:
  push:
    paths:
      - 'android/**'
      - 'public/shared/**'
      - 'public/js/**'
      - 'public/css/**'
      - 'public/img/**'
      - 'public/launcher.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compilar solo necesita leer. Publicar la descarga (que sí escribe) está en el trabajo «publish», que no recibe la clave de firma.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del servidor
        run: npm ci --omit=dev

      - name: Pruebas del sitio y del servidor
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los servidores de GitHub ya traen el SDK de Android: solo aseguramos la versión que usa la app.
      - name: SDK de Android
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de las reglas (sin Android)
        working-directory: android
        run: ./gradlew --no-daemon :core:test

      # Firma fija: solo en main. Allí, si existen los secretos TB_KEYSTORE_B64, TB_KEYSTORE_PASSWORD, TB_KEY_ALIAS y TB_KEY_PASSWORD
      # se compila el APK de release firmado (las actualizaciones se instalan encima sin desinstalar).
      # En cualquier otra rama los secretos ni siquiera se entregan al paso: se compila el APK de prueba (debug).
      # Ver docs/SEGURIDAD.md (cómo limitarlos además con un Environment de GitHub).
      - name: Preparar la firma
        id: sign
        env:
          KS: ${{ github.ref == 'refs/heads/main' && secrets.TB_KEYSTORE_B64 || '' }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tablero.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin clave de firma: se publica el APK de prueba (debug)."
          fi

      - name: Compilar el APK
        working-directory: android
        env:
          TB_KEYSTORE_FILE: ${{ runner.temp }}/tablero.jks
          TB_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.TB_KEYSTORE_PASSWORD || '' }}
          TB_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.TB_KEY_ALIAS || '' }}
          TB_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.TB_KEY_PASSWORD || '' }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then TASK=:app:assembleRelease; else TASK=:app:assembleDebug; fi
          # Cada compilación lleva un número que sube solo: así la app sabe si la publicada es más nueva que la instalada.
          ./gradlew --no-daemon $TASK -PtableroVersionCode=${{ github.run_number }} -PtableroVersion=1.0.${{ github.run_number }}

      - name: Revisar que el APK trae sus datos
        run: |
          unzip -l "${{ steps.sign.outputs.apk }}" > contenido.txt
          for f in editions maintenance restriction obd-codes; do
            grep -q "assets/$f.json" contenido.txt || { echo "::error::Falta assets/$f.json dentro del APK"; exit 1; }
          done
          for f in launcher.html css/preview.css js/preview.js js/launcher.js js/art.js js/themes.js js/fx.js shared/catalog.js shared/daylight.js shared/pico.js img/auto.png img/suv.png; do
            grep -q "assets/web/$f" contenido.txt || { echo "::error::Falta assets/web/$f dentro del APK"; exit 1; }
          done
          echo "El APK trae sus datos y la pantalla de inicio."

      - name: Dejar el APK con un nombre fijo
        run: cp "${{ steps.sign.outputs.apk }}" tablero.apk

      # Lo que la app consulta para avisar de una versión nueva. Solo con la clave fija: un APK de prueba no se puede instalar encima.
      - name: Anotar la versión publicada
        if: steps.sign.outputs.signed == 'true'
        run: echo '{"versionCode":${{ github.run_number }},"versionName":"1.0.${{ github.run_number }}"}' > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: tablero-apk
          path: |
            tablero.apk
            version.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-de-error
          path: |
            android/core/build/reports/tests
            android/app/build/reports

  # Descarga pública y siempre igual:
  # https://github.com/devece/cambio-pantalla-con-IA/releases/download/app-latest/tablero.apk
  # Solo desde main: la gente descarga de aquí, así que una rama a medio probar no puede reemplazarla.
  # El APK de cualquier rama igual queda como artefacto de la ejecución ("tablero-apk") para probarlo.
  # Este trabajo es el único con permiso de escribir y no recibe ningún secreto de firma.
  publish:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tablero-apk
          path: dist

      - name: Publicar la descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: App de la radio (última versión)
          body: |
            Instalador de la app Tablero para radios Android. Es siempre la última compilación.
            Instrucciones: https://tablero-pearl.vercel.app/listo.html
          files: |
            dist/tablero.apk
            dist/version.json
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: 'false'
